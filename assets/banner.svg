<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for subtle drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/>

  <!-- Dynamic Background Grid Lines & Glowing Elements -->
  <g opacity="0.15">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" stroke="#818cf8" stroke-width="1"/>
    <path d="M 150 0 L 150 360 M 300 0 L 300 360 M 450 0 L 450 360 M 600 0 L 600 360 M 750 0 L 750 360 M 900 0 L 900 360 M 1050 0 L 1050 360" stroke="#818cf8" stroke-width="1"/>
  </g>

  <!-- Background Pulse Rings (Dynamic Accent) -->
  <circle cx="1000" cy="180" r="140" fill="url(#shieldGlow)">
    <animate attributeName="r" values="120;150;120" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Decorative Shield Icon in Background (Right Side) -->
  <g transform="translate(930, 80) scale(1.6)" opacity="0.25">
    <path d="M40 0 L80 20 V50 C80 75 60 95 40 105 C20 95 0 75 0 50 V20 Z" fill="none" stroke="#818cf8" stroke-width="4">
      <animate attributeName="stroke-dasharray" values="0 400;300 100;0 400" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M25 50 L35 62 L55 38" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle" filter="url(#shadow)">
    <!-- Main Title -->
    <text x="600" y="140" fill="url(#titleGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="0.5">
      Awesome E-Commerce Fraud Prevention
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">
      Curated List of SaaS Platforms &amp; Open-Source Risk Detection Tools
    </text>

    <!-- Feature Pills in Banner Foreground -->
    <g transform="translate(600, 240)">
      <!-- Pill 1: Chargeback Protection -->
      <g transform="translate(-290, 0)">
        <rect x="0" y="0" width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="90" y="23" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🛡️ Chargeback Shift</text>
      </g>
      <!-- Pill 2: ATO & Bot Defense -->
      <g transform="translate(-90, 0)">
        <rect x="0" y="0" width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="90" y="23" fill="#818cf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ ATO &amp; Bot Defense</text>
      </g>
      <!-- Pill 3: AI & Graph Analytics -->
      <g transform="translate(110, 0)">
        <rect x="0" y="0" width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="90" y="23" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🤖 ML &amp; Graph Analytics</text>
      </g>
    </g>
  </g>
</svg>
